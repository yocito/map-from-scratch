<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>世界の人口 (MapLibre 比較用)</title>
<link rel="stylesheet" href="../../.cache/baselines/node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; background: #d9e8f2; font: 15px/1.5 system-ui, sans-serif; }
  #map { width: 100%; height: 100%; }
  #info { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 10px 14px; background: #fffe; border-radius: 10px; box-shadow: 0 2px 8px #0003; }
  #info:empty { display: none; }
</style>
<div id="map"></div>
<div id="info"></div>
<script src="../../.cache/baselines/node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<script type="module">
// Example 02's request done the usual way: MapLibre GL JS, one GeoJSON
// source, a fill layer stepped on population and a line layer for borders.
const Z0 = Math.log2(innerWidth / 512);   // the world fits the width, as in 02
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { c: { type: 'geojson', data: '../../data/baked/b02-maplibre/countries.geojson' } },
    layers: [
      { id: 'sea', type: 'background', paint: { 'background-color': '#d9e8f2' } },
      { id: 'fill', type: 'fill', source: 'c', paint: { 'fill-color': ['step', ['get', 'pop'],
        '#fff7ec', 1e5, '#fee8c8', 1e6, '#fdd49e', 5e6, '#fdbb84', 1e7, '#fc8d59', 3e7, '#e34a33', 1e8, '#b30000', 3e8, '#7f0000'] } },
      { id: 'line', type: 'line', source: 'c', paint: { 'line-color': '#ffffff', 'line-opacity': 0.6, 'line-width': 0.5 } },
    ],
  },
  center: [0, 0], zoom: Z0, minZoom: Z0, maxZoom: Z0 + 5, renderWorldCopies: false,
  attributionControl: false, fadeDuration: 0,
});
const info = document.getElementById('info');
map.on('click', (e) => {
  const f = map.queryRenderedFeatures(e.point, { layers: ['fill'] })[0];
  info.textContent = f ? `${f.properties.name}  人口 ${f.properties.pop.toLocaleString('ja-JP')} 人` : '';
});
await new Promise((r) => map.once('idle', r));

if (new URLSearchParams(location.search).has('bench')) {
  const { emit, glRenderer, benchFrames, zoomPath } = await import('../../harness/page/bench.js');
  const gl = map.getCanvas().getContext('webgl2');
  emit({ metric: 'first_frame_ms', value: performance.now() });
  emit({ info: { gpu: glRenderer(gl), maplibre: maplibregl.getVersion() } });

  // The same camera path as 02: 32x into Japan and back (5 zoom levels).
  const path = zoomPath(300, { cx: 138, cy: 37, z0: 0, z1: 5, pan: 0.5 });
  const cam = (p) => ({ center: [p.cx, p.cy], zoom: Z0 + p.zoom });
  // Pass 1, as a user would see it: tiles for new zoom levels are still
  // being cut in workers while frames are drawn.
  await benchFrames(gl, path.length, (i) => { map.jumpTo(cam(path[i])); map.redraw(); }, { prefix: 'cold_' });
  // Pass 2: every tile on the path is cut by now; only drawing is left.
  await benchFrames(gl, path.length, (i) => { map.jumpTo(cam(path[i])); map.redraw(); });

  // How long until a jump to a new zoom level is fully drawn.
  const settle = [];
  for (const z of [0.5, 1.5, 2.5, 3.5, 4.5]) {
    map.jumpTo({ center: [0, 0], zoom: Z0 });
    await new Promise((r) => map.once('idle', r));
    const t0 = performance.now();
    map.jumpTo({ center: [138, 37], zoom: Z0 + z });
    await new Promise((r) => map.once('idle', r));
    settle.push(performance.now() - t0);
  }
  emit({ metric: 'settle_ms', values: settle });

  map.jumpTo({ center: [0, 0], zoom: Z0 });
  await new Promise((r) => map.once('idle', r));
  const tap = [];
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 200; i++) {
    const t0 = performance.now();
    map.queryRenderedFeatures([rnd() * innerWidth, rnd() * innerHeight], { layers: ['fill'] });
    tap.push(performance.now() - t0);
  }
  emit({ metric: 'pick_ms', values: tap });
  const jp = map.queryRenderedFeatures(map.project([139.7, 35.7]), { layers: ['fill'] })[0];
  if (jp?.properties.code !== 'JPN') emit({ error: `pick at Tokyo: got ${jp?.properties.code}` });
  map.jumpTo({ center: [138, 37], zoom: Z0 + Math.log2(6) });
  await new Promise((r) => map.once('idle', r));
  emit({ done: true });
}
</script>
