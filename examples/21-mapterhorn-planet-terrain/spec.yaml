id: 21-mapterhorn-planet-terrain
request: 全球の標高を軽く読み、地域別の高解像度 PMTiles は Range で読み、地球全体から地域の標高まで専用レンダラーで 3D 表示したい。
requirements:
  - id: range
    need: 巨大な地域別 PMTiles を全量取得せず、表示に必要な索引と標高タイルを HTTP Range で読む
    unmeasured: 地域別 PMTiles への通信で Range を指定し、HTTP 200 は本文を破棄して別 URL で最大4回再試行する。206 の長さと位置を確認し、通信回数と取得量を画面に示す。
  - id: terrain
    need: 全球の標高を WebGL2 で 3D の地形として描く
    unmeasured: Terrarium 標高を球面メッシュと陰影に使う。標高による色分けを表示する。
  - id: high-resolution
    need: planet.pmtiles の上限 z12 を超える地域でも詳細な標高を表示する
    unmeasured: download_urls.json の bbox と最大ズームから地域別 PMTiles を選び、必要なタイルを Range で取得する。存在しない場所では親タイルを使う。
  - id: navigation
    need: 全球から山岳地域へ移動し、斜めから地形を見る
    unmeasured: ズーム、ドラッグ、傾斜、高さの強調と地域プリセットを用意する。
  - id: attribution
    need: 標高データの出典を表示する
    unmeasured: Mapterhorn と日本の国土地理院データの帰属を表示する。
evaluation:
  budgets: []
benchmarks:
  runtime: browser
  page: examples/21-mapterhorn-planet-terrain/index.html
  viewport: {width: 1280, height: 800, device_scale_factor: 1, mobile: false}
  iterations: 1
  scenarios: []
datasets:
  bake: []
  sources:
    - id: mapterhorn-zxy
      origin: https://tiles.mapterhorn.com/{z}/{x}/{y}.webp
      license: Mapterhorn の帰属表示に従う。日本の標高には国土地理院 基盤地図情報（数値標高モデル）を含む。
    - id: mapterhorn-areas
      origin: https://download.mapterhorn.com/download_urls.json
      license: Mapterhorn の帰属表示に従う。
  outputs: []
  preparation:
    - z0～12 は単一 WebP Terrarium タイルを CDN から取得し、全球 PMTiles の Range 応答を待たない
    - z13～18 は一覧にある bbox とズーム範囲から対象の地域別 PMTiles を選ぶ
    - 選んだ PMTiles のヘッダー、索引、WebP Terrarium タイルを HTTP Range で取得する
performance_knowledge: []
architecture_selection:
  chosen:
    platform: browser
    api: WebGL2、Fetch Range、DecompressionStream
    language: TypeScript
    gpu: hardware
    code: [examples/21-mapterhorn-planet-terrain/index.html, examples/21-mapterhorn-planet-terrain/main.ts, examples/21-mapterhorn-planet-terrain/gl.ts, examples/21-mapterhorn-planet-terrain/pmtiles.ts]
    dependencies: []
    why: 全球は CDN の単一タイルで早く描き、地域別アーカイブからは必要な標高だけを Range 取得する
  alternatives:
    - MapLibre GL JS の terrain プラグインは専用レンダラーという依頼に合わないため採用しない
  not_doing: [衛星写真の重ね合わせ, 極点周辺の標高, 一般的な地図エンジン]
verification:
  checks: []
