<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025年の地震</title>
<style>
  html, body { margin: 0; height: 100%; background: #212b3a; color: #eee; font: 14px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: calc(100% - 56px); }
  #bar { display: flex; gap: 12px; align-items: center; height: 56px; padding: 0 16px; box-sizing: border-box; }
  #bar input { flex: 1; }
  #bar button { width: 72px; }
  #when { width: 170px; font-variant-numeric: tabular-nums; }
  #big { width: 40%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #f9b; }
</style>
<canvas id="map"></canvas>
<div id="bar">
  <button id="play">再生</button>
  <input id="slider" type="range" min="0" max="525599" step="1" value="0">
  <span id="when"></span>
  <span id="big"></span>
</div>
<script type="module">
import { mount } from './quake.js';
const base = '../../data/baked/03-quake-timeline';
const map = await mount(document.getElementById('map'), base);
const T0 = Date.UTC(2025, 0, 1);
const $ = (id) => document.getElementById(id);
let list = null;
fetch(`${base}/quakes.json`).then((r) => r.json()).then((l) => { list = l; show(); });

// The largest event among those still on screen, for the caption.
function show() {
  const now = T0 + map.state.time * 60000;
  $('when').textContent = new Date(now).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  if (!list) return;
  let best = null;
  for (let i = 0; i < list.length && list[i][0] <= now; i++) {
    if (now - list[i][0] <= map.state.fade * 60000 && (!best || list[i][1] > best[1])) best = list[i];
  }
  $('big').textContent = best ? `M${best[1]} ${best[2]}` : '';
}
const setTime = (t) => { map.state.time = t; $('slider').value = t; show(); map.render(); };
$('slider').addEventListener('input', (e) => setTime(Number(e.target.value)));
let playing = false, last = 0;
const tick = (ts) => {
  if (!playing) return;
  if (last) setTime((map.state.time + (ts - last) * 1.44) % 525600);   // one day per second
  last = ts;
  requestAnimationFrame(tick);
};
$('play').addEventListener('click', () => {
  playing = !playing;
  $('play').textContent = playing ? '一時停止' : '再生';
  last = 0;
  if (playing) requestAnimationFrame(tick);
});
show();

if (new URLSearchParams(location.search).has('bench')) {
  const { emit, glRenderer, benchFrames, zoomPath } = await import('../../harness/page/bench.js');
  const { equalEarth } = await import('../../tools/geo.mjs');
  const { gl, state } = map;
  gl.canvas.addEventListener('webglcontextlost', () => emit({ error: 'webgl context lost' }));
  map.draw();
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
  emit({ metric: 'first_frame_ms', value: performance.now() });
  emit({ info: { gpu: glRenderer(gl), events: map.events } });

  // Play the whole year in 600 frames while zooming into Japan and out.
  const world = (lon, lat) => {
    const [x, y] = equalEarth([lon, lat]);
    return [(x + 2.7066) / (2 * 2.7066), (1.3174 - y) / (2 * 1.3174)];
  };
  const [jx, jy] = world(140, 36);
  const path = zoomPath(600, { cx: jx, cy: jy, z0: 1, z1: 8, pan: 0.01 });
  await benchFrames(gl, path.length, (i) => {
    state.x = path[i].cx; state.y = path[i].cy; state.zoom = path[i].zoom;
    state.time = (i / path.length) * 525600;
    map.draw();
  });

  // Functional check on the Myanmar M7.7 (2025-03-28 06:20 UTC): nothing at
  // its epicentre a day before, a red (shallow) mark half an hour after.
  state.x = 0.5; state.y = 0.5; state.zoom = 1;
  const [mx, my] = world(95.9363, 22.011);
  const sx = Math.round((mx - state.x) * state.zoom * gl.canvas.width + gl.canvas.width / 2);
  const sy = Math.round(gl.canvas.height / 2 - (my - state.y) * state.zoom * gl.canvas.width * (1.3174 / 2.7066));
  const at = (minutes) => {
    state.time = minutes;
    map.draw();
    const px = new Uint8Array(4);
    gl.readPixels(sx, gl.canvas.height - 1 - Math.round((my - state.y) * state.zoom * gl.canvas.width * (1.3174 / 2.7066) + gl.canvas.height / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return [...px];
  };
  const tq = (Date.UTC(2025, 2, 28, 6, 20, 52) - T0) / 60000;
  const before = at(tq - 1440), after = at(tq + 30);
  emit({ info: { myanmar_before: before.join(','), myanmar_after: after.join(',') } });
  emit({ check: 'myanmar-before', pass: before[0] < 230 && Math.abs(before[0] - before[1]) < 20, detail: before.join(',') });
  emit({ check: 'myanmar-after', pass: after[0] > 150 && after[1] < 120, detail: after.join(',') });

  // Leave the Kamchatka M8.8 a few hours old on screen for the screenshot.
  setTime((Date.UTC(2025, 6, 30, 3) - T0) / 60000);
  map.draw();
  emit({ done: true });
}
</script>
